<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b1111" />
            <stop offset="100%" stop-color="#180a0a" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#dc2626" />
            <stop offset="100%" stop-color="#fb923c" />
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#dc2626" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#180a0a" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Fondo de Libro con Gradiente -->
    <rect width="400" height="600" fill="url(#bgGrad)"/>
    <rect width="400" height="600" fill="url(#glow)"/>

    <!-- Lomo de libro lateral (efecto relieve 3D) -->
    <rect x="0" y="0" width="18" height="600" fill="#000000" opacity="0.35"/>
    <line x1="18" y1="0" x2="18" y2="600" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
    <line x1="22" y1="0" x2="22" y2="600" stroke="#000000" stroke-width="1.5" opacity="0.3"/>

    <!-- Marco decorativo exterior -->
    <rect x="30" y="24" width="340" height="552" rx="12" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.4"/>
    <rect x="36" y="30" width="328" height="540" rx="8" fill="none" stroke="#fb923c" stroke-width="0.75" opacity="0.25"/>

    <!-- Encabezado: Colección y Año -->
    <text x="200" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fb923c" text-anchor="middle" letter-spacing="0.2em">MEBYTECH LIBRIS • 1945</text>
    <line x1="120" y1="78" x2="280" y2="78" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8"/>

    <!-- Arte Central / Iconografía Conceptual -->
    <g filter="url(#shadow)">
        
            <!-- Silueta rebelde y estrella de la granja -->
            <circle cx="200" cy="245" r="50" fill="#dc2626" opacity="0.25"/>
            <!-- Silueta de la cabeza del cerdo Napoleón estilizada -->
            <path d="M160 270 Q160 220 200 220 Q240 220 240 270 Q200 290 160 270 Z" fill="#f87171" opacity="0.85"/>
            <polygon points="160,225 145,195 175,210" fill="#f87171"/>
            <polygon points="240,225 255,195 225,210" fill="#f87171"/>
            <!-- Hocico y estrella -->
            <ellipse cx="200" cy="260" rx="18" ry="12" fill="#b91c1c"/>
            <circle cx="193" cy="260" r="3" fill="#450a0a"/>
            <circle cx="207" cy="260" r="3" fill="#450a0a"/>
            <polygon points="200,165 204,178 217,178 207,186 211,199 200,191 189,199 193,186 183,178 196,178" fill="#fbbf24"/>
        
    </g>

    <!-- Título de la Obra -->
    <g filter="url(#shadow)">
        <text x="200" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">Rebelión en la</text>
<text x="200" y="401" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">granja</text>

    </g>

    <!-- Separador decorativo inferior -->
    <line x1="150" y1="465" x2="250" y2="465" stroke="url(#accentGrad)" stroke-width="2"/>
    <circle cx="200" cy="465" r="3.5" fill="#dc2626"/>

    <!-- Autor -->
    <text x="200" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.05em">George Orwell</text>

    <!-- Pastilla de Género -->
    <rect x="110" y="522" width="180" height="24" rx="12" fill="#3b1111" stroke="#dc2626" stroke-width="1" opacity="0.9"/>
    <text x="200" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#fb923c" text-anchor="middle">Novela Literaria</text>

</svg>