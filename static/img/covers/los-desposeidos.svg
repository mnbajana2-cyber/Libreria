<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#1c1917" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#1c1917" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Fondo de Libro con Gradiente -->
    <rect width="400" height="600" fill="url(#bgGrad)"/>
    <rect width="400" height="600" fill="url(#glow)"/>

    <!-- Lomo de libro lateral (efecto relieve 3D) -->
    <rect x="0" y="0" width="18" height="600" fill="#000000" opacity="0.35"/>
    <line x1="18" y1="0" x2="18" y2="600" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
    <line x1="22" y1="0" x2="22" y2="600" stroke="#000000" stroke-width="1.5" opacity="0.3"/>

    <!-- Marco decorativo exterior -->
    <rect x="30" y="24" width="340" height="552" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.4"/>
    <rect x="36" y="30" width="328" height="540" rx="8" fill="none" stroke="#cbd5e1" stroke-width="0.75" opacity="0.25"/>

    <!-- Encabezado: Colección y Año -->
    <text x="200" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2em">MEBYTECH LIBRIS • 1974</text>
    <line x1="120" y1="78" x2="280" y2="78" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8"/>

    <!-- Arte Central / Iconografía Conceptual -->
    <g filter="url(#shadow)">
        
            <!-- Planetas gemelos Anarres y Urras -->
            <circle cx="160" cy="235" r="42" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
            <circle cx="240" cy="265" r="30" fill="#334155" stroke="#cbd5e1" stroke-width="1.5"/>
            <path d="M125 240 Q160 210 195 240" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6"/>
            <circle cx="160" cy="235" r="42" fill="none" stroke="#e2e8f0" stroke-width="1" opacity="0.4"/>
            <!-- Trayectoria del ansible / viaje -->
            <path d="M185 220 Q205 210 225 245" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
        
    </g>

    <!-- Título de la Obra -->
    <g filter="url(#shadow)">
        <text x="200" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">Los desposeídos</text>

    </g>

    <!-- Separador decorativo inferior -->
    <line x1="150" y1="465" x2="250" y2="465" stroke="url(#accentGrad)" stroke-width="2"/>
    <circle cx="200" cy="465" r="3.5" fill="#94a3b8"/>

    <!-- Autor -->
    <text x="200" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.05em">Ursula K. Le Guin</text>

    <!-- Pastilla de Género -->
    <rect x="110" y="522" width="180" height="24" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1" opacity="0.9"/>
    <text x="200" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" text-anchor="middle">Ficción Especulativa</text>

</svg>