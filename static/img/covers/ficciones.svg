<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="100%" stop-color="#09090b" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#eab308" />
            <stop offset="100%" stop-color="#ca8a04" />
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#eab308" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Fondo de Libro con Gradiente -->
    <rect width="400" height="600" fill="url(#bgGrad)"/>
    <rect width="400" height="600" fill="url(#glow)"/>

    <!-- Lomo de libro lateral (efecto relieve 3D) -->
    <rect x="0" y="0" width="18" height="600" fill="#000000" opacity="0.35"/>
    <line x1="18" y1="0" x2="18" y2="600" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
    <line x1="22" y1="0" x2="22" y2="600" stroke="#000000" stroke-width="1.5" opacity="0.3"/>

    <!-- Marco decorativo exterior -->
    <rect x="30" y="24" width="340" height="552" rx="12" fill="none" stroke="#eab308" stroke-width="1.5" opacity="0.4"/>
    <rect x="36" y="30" width="328" height="540" rx="8" fill="none" stroke="#ca8a04" stroke-width="0.75" opacity="0.25"/>

    <!-- Encabezado: Colección y Año -->
    <text x="200" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ca8a04" text-anchor="middle" letter-spacing="0.2em">MEBYTECH LIBRIS • 1944</text>
    <line x1="120" y1="78" x2="280" y2="78" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8"/>

    <!-- Arte Central / Iconografía Conceptual -->
    <g filter="url(#shadow)">
        
            <!-- Laberinto circular borgiano concéntrico -->
            <circle cx="200" cy="250" r="65" fill="none" stroke="#eab308" stroke-width="2"/>
            <circle cx="200" cy="250" r="48" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="25 15"/>
            <circle cx="200" cy="250" r="32" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="18 10"/>
            <circle cx="200" cy="250" r="16" fill="none" stroke="#fde047" stroke-width="2"/>
            <circle cx="200" cy="250" r="5" fill="#fef08a"/>
            <!-- Ejes del laberinto -->
            <line x1="200" y1="185" x2="200" y2="218" stroke="#eab308" stroke-width="2"/>
            <line x1="200" y1="282" x2="200" y2="315" stroke="#eab308" stroke-width="2"/>
            <line x1="135" y1="250" x2="168" y2="250" stroke="#eab308" stroke-width="2"/>
            <line x1="232" y1="250" x2="265" y2="250" stroke="#eab308" stroke-width="2"/>
        
    </g>

    <!-- Título de la Obra -->
    <g filter="url(#shadow)">
        <text x="200" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">Ficciones</text>

    </g>

    <!-- Separador decorativo inferior -->
    <line x1="150" y1="465" x2="250" y2="465" stroke="url(#accentGrad)" stroke-width="2"/>
    <circle cx="200" cy="465" r="3.5" fill="#eab308"/>

    <!-- Autor -->
    <text x="200" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.05em">Jorge Luis Borges</text>

    <!-- Pastilla de Género -->
    <rect x="110" y="522" width="180" height="24" rx="12" fill="#1e1b4b" stroke="#eab308" stroke-width="1" opacity="0.9"/>
    <text x="200" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ca8a04" text-anchor="middle">Ficción Especulativa</text>

</svg>