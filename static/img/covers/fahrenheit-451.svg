<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b0c0c" />
            <stop offset="100%" stop-color="#0f0303" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f97316" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#0f0303" stop-opacity="0" />
        </radialGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Fondo de Libro con Gradiente -->
    <rect width="400" height="600" fill="url(#bgGrad)"/>
    <rect width="400" height="600" fill="url(#glow)"/>

    <!-- Lomo de libro lateral (efecto relieve 3D) -->
    <rect x="0" y="0" width="18" height="600" fill="#000000" opacity="0.35"/>
    <line x1="18" y1="0" x2="18" y2="600" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
    <line x1="22" y1="0" x2="22" y2="600" stroke="#000000" stroke-width="1.5" opacity="0.3"/>

    <!-- Marco decorativo exterior -->
    <rect x="30" y="24" width="340" height="552" rx="12" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.4"/>
    <rect x="36" y="30" width="328" height="540" rx="8" fill="none" stroke="#ef4444" stroke-width="0.75" opacity="0.25"/>

    <!-- Encabezado: Colección y Año -->
    <text x="200" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ef4444" text-anchor="middle" letter-spacing="0.2em">MEBYTECH LIBRIS • 1953</text>
    <line x1="120" y1="78" x2="280" y2="78" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8"/>

    <!-- Arte Central / Iconografía Conceptual -->
    <g filter="url(#shadow)">
        
            <!-- Llamas consumidoras de libros (451 grados) -->
            <path d="M200 170 C220 210 250 230 240 270 C230 300 210 320 200 320 C190 320 170 300 160 270 C150 230 180 210 200 170 Z" fill="#ea580c" opacity="0.9"/>
            <path d="M200 210 C210 235 230 250 225 275 C220 295 210 310 200 310 C190 310 180 295 175 275 C170 250 190 235 200 210 Z" fill="#facc15"/>
            <!-- Páginas ardiendo -->
            <rect x="160" y="300" width="80" height="14" rx="2" fill="#78350f"/>
            <circle cx="240" cy="200" r="3" fill="#fed7aa"/>
            <circle cx="160" cy="230" r="2.5" fill="#fde047"/>
            <circle cx="225" cy="180" r="2" fill="#f97316"/>
        
    </g>

    <!-- Título de la Obra -->
    <g filter="url(#shadow)">
        <text x="200" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">Fahrenheit 451</text>

    </g>

    <!-- Separador decorativo inferior -->
    <line x1="150" y1="465" x2="250" y2="465" stroke="url(#accentGrad)" stroke-width="2"/>
    <circle cx="200" cy="465" r="3.5" fill="#f97316"/>

    <!-- Autor -->
    <text x="200" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.05em">Ray Bradbury</text>

    <!-- Pastilla de Género -->
    <rect x="110" y="522" width="180" height="24" rx="12" fill="#3b0c0c" stroke="#f97316" stroke-width="1" opacity="0.9"/>
    <text x="200" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ef4444" text-anchor="middle">Ciencia Ficción Distópica</text>

</svg>